name: Check styling

on: [push, pull_request]

permissions:
    contents: read

jobs:
    php-cs-fixer:
        runs-on: ubuntu-latest

        steps:
            -   name: Checkout code
                uses: actions/checkout@v4

            -   name: Setup PHP
                uses: shivammathur/setup-php@v2
                with:
                    php-version: '8.4'
                    tools: php-cs-fixer:3
                    coverage: none

            -   name: Check PHP styling
                run: php-cs-fixer fix --dry-run --diff
